<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230f172a%27/%3E%3Cpath d=%27M26 30 h48 a6 6 0 0 1 6 6 v32 a6 6 0 0 1 -6 6 h-4 a4 4 0 0 1 -4 -4 v-2 h-32 v2 a4 4 0 0 1 -4 4 h-4 a6 6 0 0 1 -6 -6 v-32 a6 6 0 0 1 6 -6 z%27 fill=%27none%27 stroke=%27%2338bdf8%27 stroke-width=%274%27 stroke-linejoin=%27round%27/%3E%3Cline x1=%2726%27 y1=%2752%27 x2=%2774%27 y2=%2752%27 stroke=%27%2338bdf8%27 stroke-width=%274%27/%3E%3Ccircle cx=%2738%27 cy=%2762%27 r=%273%27 fill=%27%2338bdf8%27/%3E%3Ccircle cx=%2762%27 cy=%2762%27 r=%273%27 fill=%27%2338bdf8%27/%3E%3C/svg%3E" />
  <title>BusConnect - Painel do Motorista</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="tela-login" class="overlay-login">
    <div class="login-box">
      <div class="login-marca">BusConnect</div>
      <div class="login-sub">Painel do Motorista</div>

      <form id="form-login" autocomplete="on">
        <label class="login-label">E-mail</label>
        <input id="login-email" type="email" placeholder="motorista@busconnect.com" required autofocus />

        <label class="login-label">Senha</label>
        <input id="login-senha" type="password" placeholder="Sua senha" required />

        <div id="login-erro" class="login-erro"></div>

        <button type="submit" class="btn-login">ENTRAR</button>
      </form>

      <div class="login-hint">
        Usuário de teste: <b>motorista@busconnect.com</b> / <b>senha123</b>
      </div>
    </div>
  </div>

  <header>
    <div class="marca"><svg class="logo-svg" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="20" r="1.5" fill="currentColor"/><circle cx="16" cy="20" r="1.5" fill="currentColor"/></svg> <span>BusConnect</span></div>
    <div class="identificacao">
      <span id="linha">LINHA —</span>
      <span id="onibus">ÔNIBUS —</span>
    </div>
    <div class="header-right">
      <span id="usuario-logado" class="usuario-logado"></span>
      <div class="status" id="status">Conectando...</div>
      <button id="btn-logout" class="btn-logout" title="Sair">Sair</button>
    </div>
  </header>

  <main>
    <section class="proxima-parada" id="proxima-parada">
      <div class="titulo">PRÓXIMA PARADA</div>
      <div class="nome-ponto" id="nome-ponto">Aguardando...</div>
      <div class="info-passageiros" id="info-passageiros"></div>
    </section>

    <section class="info-viagem">
      <div>
        <div class="label">PONTO ATUAL</div>
        <div class="valor" id="ponto-atual">—</div>
      </div>
      <div>
        <div class="label">PASSAGEIROS ATIVOS</div>
        <div class="valor" id="passageiros-ativos">—</div>
      </div>
      <div>
        <div class="label">GPS</div>
        <div class="valor pequeno" id="gps">—</div>
      </div>
    </section>

    <section class="mapa-bloco">
      <div class="label">MAPA DA ROTA</div>
      <div id="mapa-motorista"></div>
    </section>

    <section class="historico">
      <div class="label">ÚLTIMOS AVISOS</div>
      <ul id="historico-lista"></ul>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
