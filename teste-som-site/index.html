<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teste de Som e Vibracao</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f1f5f9; padding: 30px 20px; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 24px; }
  button { width: 100%; padding: 22px; margin: 10px 0; font-size: 18px; font-weight: 800; background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; cursor: pointer; }
  button:active { transform: scale(0.98); }
  #status { margin-top: 20px; padding: 14px; background: #1e293b; border-radius: 12px; font-size: 13px; text-align: left; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>
  <h1>🔊📳 Teste</h1>

  <button onclick="testarSom()">1. Tocar som (square 1s)</button>
  <button onclick="testarVib()">2. Vibrar 1 vez</button>
  <button onclick="testarVib3()">3. Vibrar 3 vezes</button>
  <button onclick="testarTudo()">4. Som + Vibracao juntos</button>

  <div id="status">Aguardando...</div>

<script>
function log(m) {
  document.getElementById('status').textContent += '\n' + m;
  console.log(m);
}

let ctx = null;
function initCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function testarSom() {
  initCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'square';
  osc.frequency.value = 1000;
  const t = ctx.currentTime;
  gain.gain.setValueAtTime(1.0, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 1);
  osc.start(t);
  osc.stop(t + 1.05);
  log('Som 1000Hz por 1s');
}

function testarVib() {
  if (!navigator.vibrate) {
    log('navigator.vibrate NAO suportado');
    return;
  }
  const ok = navigator.vibrate(500);
  log('Vibrar 1x (500ms) -> retorno: ' + ok);
}

function testarVib3() {
  if (!navigator.vibrate) {
    log('navigator.vibrate NAO suportado');
    return;
  }
  const ok = navigator.vibrate([300, 100, 300, 100, 300]);
  log('Vibrar 3x -> retorno: ' + ok);
}

function testarTudo() {
  testarSom();
  setTimeout(testarVib3, 100);
}

log('Pagina carregada.');
log('navigator.vibrate disponivel? ' + ('vibrate' in navigator));
log('User agent: ' + navigator.userAgent);
</script>
</body>
</html>
