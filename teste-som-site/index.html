<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teste de Som</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    padding: 40px 20px;
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 30px; }
  button {
    width: 100%;
    padding: 24px;
    margin: 12px 0;
    font-size: 20px;
    font-weight: 800;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  #status {
    margin-top: 24px;
    padding: 16px;
    background: #1e293b;
    border-radius: 12px;
    font-size: 14px;
    text-align: left;
    white-space: pre-wrap;
    font-family: monospace;
  }
</style>
</head>
<body>
  <h1>🔊 Teste de Som</h1>

  <button id="btn1">1. Testar AudioContext (beep curto)</button>
  <button id="btn2">2. Testar beep mais longo</button>
  <button id="btn3">3. Testar 3 bipes ascendentes</button>

  <div id="status">Aguardando teste...</div>

<script>
let ctx = null;

function log(msg) {
  const el = document.getElementById('status');
  el.textContent += '\n' + msg;
  console.log(msg);
}

function initCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    log('AudioContext criado.');
  }
  if (ctx.state === 'suspended') {
    ctx.resume().then(() => log('AudioContext resumed -> ' + ctx.state));
  } else {
    log('AudioContext estado: ' + ctx.state);
  }
}

function beep(freq, duracao, tipo) {
  if (!ctx) initCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = tipo || 'sine';
  osc.frequency.value = freq;
  const t = ctx.currentTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duracao);
  osc.start(t);
  osc.stop(t + duracao + 0.05);
  log('Beep ' + freq + 'Hz por ' + duracao + 's');
}

document.getElementById('btn1').onclick = () => {
  log('--- Teste 1 ---');
  initCtx();
  setTimeout(() => beep(440, 0.3), 100);
};

document.getElementById('btn2').onclick = () => {
  log('--- Teste 2 ---');
  initCtx();
  setTimeout(() => beep(440, 1.0), 100);
};

document.getElementById('btn3').onclick = () => {
  log('--- Teste 3 ---');
  initCtx();
  setTimeout(() => {
    beep(660, 0.2);
    setTimeout(() => beep(880, 0.2), 300);
    setTimeout(() => beep(1100, 0.2), 600);
  }, 100);
};

log('Pagina carregada. Clique nos botoes.');
log('Navegador: ' + navigator.userAgent);
</script>
</body>
</html>
